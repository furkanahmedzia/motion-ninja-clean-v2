name: Build Motion Ninja Clean APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for original Motion Ninja APK (optional if release asset exists)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'rebuild/**'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmake-version: '3.22.1'
          build-tools-version: '34.0.0'
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('rebuild/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      
      - name: Make gradlew executable
        run: chmod +x rebuild/gradlew
      
      - name: Download original APK
        run: |
          cd rebuild
          APK_URL="${{ github.event.inputs.apk_url }}"
          
          # Try release asset first
          if gh release download --repo ${{ github.repository }} --pattern "original.apk" --clobber 2>/dev/null; then
            echo "✅ Downloaded from release asset"
          elif [ -n "$APK_URL" ]; then
            echo "📥 Downloading from URL: $APK_URL"
            # Handle Google Drive links
            if [[ "$APK_URL" == *"drive.google.com"* ]]; then
              # Extract file ID from various Google Drive URL formats
              if [[ "$APK_URL" == *"file/d/"* ]]; then
                FILE_ID=$(echo "$APK_URL" | sed -n 's/.*file\/d\/\([^\/]*\).*/\1/p')
              elif [[ "$APK_URL" == *"id="* ]]; then
                FILE_ID=$(echo "$APK_URL" | sed -n 's/.*id=\([^&]*\).*/\1/p')
              else
                echo "❌ Could not extract Google Drive file ID"
                exit 1
              fi
              echo "📎 Google Drive file ID: $FILE_ID"
              # Use gdown (handles confirmation, cookies, large files)
              curl -sSL "https://github.com/wkentaro/gdown/releases/download/v4.7.1/gdown_linux_x86_64" -o /tmp/gdown
              chmod +x /tmp/gdown
              /tmp/gdown "https://drive.google.com/uc?id=$FILE_ID" -O original.apk
            else
              # Direct download
              curl -L -o original.apk "$APK_URL"
            fi
          else
            echo "❌ No APK source. Provide apk_url input or create release with 'original.apk' asset."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Verify APK downloaded
        run: |
          cd rebuild
          ls -lh original.apk
          file original.apk
      
      - name: Build Debug APK
        run: |
          cd rebuild
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Verify APK
        run: |
          ls -lh rebuild/app/build/outputs/apk/debug/
          unzip -l rebuild/app/build/outputs/apk/debug/app-debug.apk | head -20
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-ninja-clean-debug
          path: rebuild/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: rebuild/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

  # Optional: Build Release APK
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - uses: android-actions/setup-android@v3
        with: { api-level: 34, ndk-version: r26c, cmake-version: '3.22.1' }
      - name: Download original APK
        run: |
          cd rebuild
          APK_URL="${{ github.event.inputs.apk_url }}"
          
          # Try release asset first
          if gh release download --repo ${{ github.repository }} --pattern "original.apk" --clobber 2>/dev/null; then
            echo "✅ Downloaded from release asset"
          elif [ -n "$APK_URL" ]; then
            echo "📥 Downloading from URL: $APK_URL"
            # Handle Google Drive links
            if [[ "$APK_URL" == *"drive.google.com"* ]]; then
              if [[ "$APK_URL" == *"file/d/"* ]]; then
                FILE_ID=$(echo "$APK_URL" | sed -n 's/.*file\/d\/\([^\/]*\).*/\1/p')
              elif [[ "$APK_URL" == *"id="* ]]; then
                FILE_ID=$(echo "$APK_URL" | sed -n 's/.*id=\([^&]*\).*/\1/p')
              else
                echo "❌ Could not extract Google Drive file ID"
                exit 1
              fi
              echo "📎 Google Drive file ID: $FILE_ID"
              curl -sSL "https://github.com/wkentaro/gdown/releases/download/v4.7.1/gdown_linux_x86_64" -o /tmp/gdown
              chmod +x /tmp/gdown
              /tmp/gdown "https://drive.google.com/uc?id=$FILE_ID" -O original.apk
            else
              curl -L -o original.apk "$APK_URL"
            fi
          else
            echo "❌ No APK source"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Extract native libs
        run: |
          cd rebuild
          ./extract_native_libs.sh "original.apk"
      - name: Build Release
        run: cd rebuild && ./gradlew assembleRelease --no-daemon
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: motion-ninja-clean-release
          path: rebuild/app/build/outputs/apk/release/app-release.apk